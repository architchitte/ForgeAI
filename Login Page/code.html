<script>
  function togglePasswordVisibility() {
    const keyInput = document.getElementById('encryption-key');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!keyInput || !eyeIcon) return;
    
    if (keyInput.type === 'password') {
      keyInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      keyInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function simulateAuth() {
    const btnLabel = document.getElementById('btnLabel');
    const btnIcon = document.getElementById('btnIcon');
    const submitBtn = document.getElementById('submitBtn');
    const syncProgressBar = document.getElementById('syncProgressBar');
    const syncRateText = document.getElementById('syncRateText');

    if (!btnLabel || !btnIcon || !submitBtn) return;

    btnLabel.textContent = 'Collapsing Horizon...';
    btnIcon.textContent = 'sync';
    btnIcon.classList.add('animate-spin');
    submitBtn.classList.add('opacity-90', 'pointer-events-none');

    if (syncProgressBar && syncRateText) {
      syncProgressBar.style.width = '100%';
      syncRateText.textContent = 'ESTABLISHING...';
    }

    setTimeout(() => {
      btnLabel.textContent = 'Session Synchronized';
      btnIcon.textContent = 'verified';
      btnIcon.classList.remove('animate-spin');
      if (syncRateText) syncRateText.textContent = 'LOCKED';
      
      setTimeout(() => {
        btnLabel.textContent = 'Initialize Session';
        btnIcon.textContent = 'bolt';
        submitBtn.classList.remove('opacity-90', 'pointer-events-none');
        if (syncRateText) syncRateText.textContent = '99.98%';
      }, 2000);
    }, 1200);
  }

  function handleWorkspaceAuth() {
    const syncRateText = document.getElementById('syncRateText');
    if (syncRateText) syncRateText.textContent = 'FEDERATING SSO...';
    setTimeout(() => {
      if (syncRateText) syncRateText.textContent = '99.98%';
    }, 1500);
  }
</script></main>
